<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulate Anything</title>
<style>
:root {
  color-scheme: light;
  --page: #f4f4f1; --surface: #fcfcfb; --sunken: #efeeea; --border: #e0dfd9;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7d7c74; --grid: #e6e5df;
  --accent: #2a78d6; --accent-ink: #ffffff;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --neutral: #a3a299;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #121211; --surface: #1a1a19; --sunken: #232321; --border: #34342f;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e85; --grid: #2b2b28;
    --accent: #3987e5; --accent-ink: #0b0b0b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --neutral: #6f6e66;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
#app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100%; }
#app.static { grid-template-columns: minmax(0, 1fr); }
aside { border-right: 1px solid var(--border); background: var(--surface);
  padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; padding: 0 8px; }
.tagline { color: var(--text-3); font-size: 12px; padding: 2px 8px 12px; }
#search { width: 100%; padding: 7px 10px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--page); margin-bottom: 8px; }
.domain { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-3); padding: 12px 8px 4px; }
.nav-item { display: block; width: 100%; text-align: left; border: 0; background: none;
  padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--text-2); }
.nav-item:hover { background: var(--sunken); }
.nav-item[aria-current="true"] { background: var(--sunken); color: var(--text); font-weight: 600; }
main { padding: 22px 26px 60px; max-width: 1280px; width: 100%; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.015em; }
h2 { font-size: 13px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-3); font-weight: 600; }
.lead { color: var(--text-2); margin: 0 0 18px; max-width: 80ch; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; }
#ask { margin-bottom: 22px; }
.ask-row { display: flex; gap: 8px; }
.ask-row input { flex: 1; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--page); min-width: 0; }
.btn { border: 1px solid var(--border); background: var(--surface); padding: 8px 14px;
  border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent);
  color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.hint { color: var(--text-3); font-size: 12px; margin-top: 6px; }
.answer { white-space: pre-wrap; margin-top: 12px; padding-top: 12px;
  border-top: 1px solid var(--border); color: var(--text-2); }
.attempts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
  border: 1px solid var(--border); border-radius: 999px; font-size: 12px;
  background: var(--page); cursor: pointer; color: var(--text-2); }
.chip[aria-pressed="true"] { border-color: var(--text-2); color: var(--text); }
#workspace { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px;
  align-items: start; }
#app.static #workspace { grid-template-columns: minmax(0, 1fr); }
.field { margin-bottom: 14px; }
.field label { display: block; font-weight: 600; font-size: 13px; }
.field .doc { color: var(--text-3); font-size: 12px; margin: 1px 0 5px; }
.field input[type=text], .field input[type=number], .field select, .field textarea {
  width: 100%; padding: 6px 9px; border: 1px solid var(--border); border-radius: 7px;
  background: var(--page); }
.field textarea { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  min-height: 110px; resize: vertical; }
.field input[type=range] { width: 100%; margin: 6px 0 0; accent-color: var(--accent); }
.field .err { color: var(--critical); font-size: 12px; }
.form-foot { display: flex; gap: 8px; margin-top: 4px; }
#results { display: flex; flex-direction: column; gap: 16px; transition: opacity .15s; }
#results.loading { opacity: .5; }
.verdict { display: flex; align-items: center; gap: 12px; }
.verdict .big { font-size: 17px; font-weight: 700; }
.verdict .sub { color: var(--text-2); font-size: 13px; }
.badge { display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px;
  border-radius: 50%; color: #fff; font-size: 13px; font-weight: 700; line-height: 1; }
.badge.lg { width: 34px; height: 34px; font-size: 19px; }
.badge.pass { background: var(--good); } .badge.warn { background: var(--warning); color: #0b0b0b; }
.badge.fail { background: var(--critical); } .badge.skip { background: var(--neutral); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 11px 13px; min-width: 0; }
.tile .k { color: var(--text-2); font-size: 12px; overflow-wrap: anywhere; }
.tile .v { font-size: 21px; font-weight: 650; letter-spacing: -.01em; margin-top: 2px;
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .u { font-size: 12px; font-weight: 400; color: var(--text-2); margin-left: 4px; }
.plots { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px;
  align-items: start; }
.plot-title { font-weight: 600; margin-bottom: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px;
  color: var(--text-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle;
  margin-right: 6px; border-radius: 1px; }
svg text { fill: var(--text-2); font-size: 11px; }
.heat { display: flex; gap: 12px; align-items: stretch; }
.heat-main { flex: 1; min-width: 0; max-width: 680px; }
.heat canvas.img { width: 100%; display: block; border-radius: 4px; image-rendering: auto;
  cursor: crosshair; }
.heat .axis { display: flex; justify-content: space-between; color: var(--text-2);
  font-size: 11px; margin-top: 3px; }
.cbar { display: flex; flex-direction: column; align-items: flex-start; font-size: 11px;
  color: var(--text-2); width: 62px; flex: none; }
.cbar canvas { width: 12px; height: 0; flex: 1 1 auto; border-radius: 3px; margin: 3px 0; min-height: 80px; }
details.table { margin-top: 8px; font-size: 12px; color: var(--text-2); }
details.table table { border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
details.table td, details.table th { padding: 2px 10px 2px 0; text-align: right; }
.checks-cat { margin: 14px 0 6px; font-weight: 600; text-transform: capitalize; }
.checks-cat:first-of-type { margin-top: 0; }
.check { display: grid; grid-template-columns: 22px 62px minmax(0, 1fr); gap: 4px 10px;
  padding: 7px 0; border-top: 1px solid var(--grid); align-items: start; }
.check .st { font-size: 12px; color: var(--text-2); padding-top: 2px; }
.check .nm { font-weight: 600; }
.check .dt { color: var(--text-2); font-size: 13px; overflow-wrap: anywhere; }
.check.skip .nm, .check.skip .dt { color: var(--text-3); font-weight: 400; }
.note { color: var(--text-2); font-size: 13px; white-space: pre-wrap; }
.run-head { font-weight: 700; font-size: 16px; margin-top: 10px; }
#tooltip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 12px;
  box-shadow: 0 4px 16px rgb(0 0 0 / .14); display: none; max-width: 280px; }
#tooltip .tt-h { color: var(--text-2); margin-bottom: 3px; }
#tooltip .tt-r { display: flex; align-items: center; gap: 7px; }
#tooltip .tt-r i { width: 12px; height: 2px; border-radius: 1px; flex: none; }
#tooltip .tt-r b { font-variant-numeric: tabular-nums; }
#tooltip .tt-r span { color: var(--text-2); }
@media (max-width: 980px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; height: auto; max-height: 240px; border-right: 0;
    border-bottom: 1px solid var(--border); }
  #workspace { grid-template-columns: minmax(0, 1fr); }
  main { padding: 16px; }
  .plots { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">Simulate Anything</div>
    <div class="tagline">Simulations that check themselves</div>
    <input id="search" type="search" placeholder="Search simulations" aria-label="Search simulations">
    <nav id="nav"></nav>
  </aside>
  <main>
    <section id="ask" class="card">
      <h2>Describe a problem</h2>
      <div class="ask-row">
        <input id="ask-input" type="text" aria-label="Problem description"
          placeholder="e.g. How hot does a 5 W chip get on a 100 x 80 mm board in still air?">
        <button id="ask-btn" class="btn primary">Simulate</button>
      </div>
      <div id="ask-hint" class="hint"></div>
      <div id="ask-out"></div>
    </section>
    <header id="head"></header>
    <div id="workspace">
      <section id="params" class="card"></section>
      <section id="results"></section>
    </div>
  </main>
</div>
<div id="tooltip" role="status"></div>
<!--STATIC-DATA-->
<script>
"use strict";
const $ = (id) => document.getElementById(id);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
const SVG = "http://www.w3.org/2000/svg";
function svg(tag, attrs) {
  const n = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  return n;
}
function fmt(v) {
  if (v === null || v === undefined || !isFinite(v)) return "-";
  const a = Math.abs(v);
  if (a === 0) return "0";
  if (a >= 1e6 || a < 1e-3) return v.toExponential(3).replace(/\.?0+e/, "e");
  return String(parseFloat(v.toPrecision(4)));
}
const human = (s) => s.replace(/_/g, " ");
const unit = (u) => (u || "").replace(/degC/g, "\u00b0C").replace(/\^2/g, "\u00b2")
  .replace(/\^3/g, "\u00b3").replace(/\*/g, "\u00b7");
const dark = () => matchMedia("(prefers-color-scheme: dark)").matches;
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const SERIES = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];

/* ---------- tooltip ---------- */
const tip = $("tooltip");
function showTip(evt, head, rows) {
  tip.replaceChildren(el("div", { class: "tt-h" }, head), ...rows.map((r) =>
    el("div", { class: "tt-r" }, r.color ? el("i", { style: `background:${r.color}` }) : null,
      el("b", {}, r.value), r.label ? el("span", {}, r.label) : null)));
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = evt.clientX + 14, y = evt.clientY + 14;
  if (x + w > innerWidth - 8) x = evt.clientX - w - 14;
  if (y + h > innerHeight - 8) y = evt.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.display = "none"; };

/* ---------- colour ramps ---------- */
const BLUES = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5",
  "#2a78d6", "#256abf", "#1c5cab", "#184f95", "#104281", "#0d366b"];
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function ramp(stops) {
  const rgb = stops.map(hex);
  return (t) => {
    t = Math.min(1, Math.max(0, t)) * (rgb.length - 1);
    const i = Math.min(rgb.length - 2, Math.floor(t)), f = t - i;
    return rgb[i].map((c, k) => Math.round(c + (rgb[i + 1][k] - c) * f));
  };
}
function colourScale(vmin, vmax) {
  const diverging = vmin < 0 && vmax > 0 &&
    Math.min(-vmin, vmax) > 0.05 * Math.max(-vmin, vmax);
  if (diverging) {
    const m = Math.max(-vmin, vmax), mid = dark() ? "#383835" : "#f0efec";
    const neg = ramp(dark() ? [mid, "#256abf", "#6da7ec"] : [mid, "#3987e5", "#0d366b"]);
    const pos = ramp(dark() ? [mid, "#b83a3a", "#f08a8a"] : [mid, "#e34948", "#8f1f1f"]);
    return { lo: -m, hi: m, at: (v) => (v < 0 ? neg(-v / m) : pos(v / m)) };
  }
  const seq = ramp(dark() ? [...BLUES].reverse() : BLUES);   // low values recede
  const span = vmax - vmin || 1;
  return { lo: vmin, hi: vmax, at: (v) => seq((v - vmin) / span) };
}

/* ---------- line chart ---------- */
function ticks(lo, hi, n) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step)
    out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return out;
}
function lineChart(host, f) {
  const names = Object.keys(f.series), x = f.x;
  const draw = () => {
    host.querySelector("svg")?.remove();
    const W = Math.max(280, host.clientWidth - 32), H = 250, m = { l: 58, r: 14, t: 10, b: 38 };
    const all = names.flatMap((n) => f.series[n]).filter((v) => v !== null);
    let ylo = Math.min(...all), yhi = Math.max(...all);
    const pad = (yhi - ylo || Math.abs(yhi) || 1) * 0.06;
    ylo -= pad; yhi += pad;
    const xlo = Math.min(...x), xhi = Math.max(...x);
    const X = (v) => m.l + (v - xlo) / (xhi - xlo || 1) * (W - m.l - m.r);
    const Y = (v) => H - m.b - (v - ylo) / (yhi - ylo) * (H - m.t - m.b);
    const s = svg("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img" });
    for (const t of ticks(ylo, yhi, 5)) {
      s.append(svg("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t),
        stroke: "var(--grid)", "stroke-width": 1 }));
      const tx = svg("text", { x: m.l - 7, y: Y(t) + 3.5, "text-anchor": "end" });
      tx.textContent = fmt(t); s.append(tx);
    }
    for (const t of ticks(xlo, xhi, Math.max(3, Math.floor(W / 90)))) {
      const tx = svg("text", { x: X(t), y: H - m.b + 15, "text-anchor": "middle" });
      tx.textContent = fmt(t); s.append(tx);
    }
    const xl = svg("text", { x: (m.l + W - m.r) / 2, y: H - 5, "text-anchor": "middle" });
    xl.textContent = unit(f.xlabel); s.append(xl);
    const yl = svg("text", { x: 12, y: (m.t + H - m.b) / 2, "text-anchor": "middle",
      transform: `rotate(-90 12 ${(m.t + H - m.b) / 2})` });
    yl.textContent = unit(f.ylabel || f.unit); s.append(yl);
    names.forEach((n, k) => {
      let d = "", pen = false;
      f.series[n].forEach((v, i) => {
        if (v === null) { pen = false; return; }
        d += `${pen ? "L" : "M"}${X(x[i]).toFixed(1)},${Y(v).toFixed(1)}`; pen = true;
      });
      s.append(svg("path", { d, fill: "none", stroke: `var(${SERIES[k % 8]})`,
        "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    });
    const hair = svg("line", { y1: m.t, y2: H - m.b, stroke: "var(--text-3)",
      "stroke-width": 1, visibility: "hidden" });
    s.append(hair);
    const dots = names.map((n, k) => {
      const c = svg("circle", { r: 4, fill: `var(${SERIES[k % 8]})`,
        stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
      s.append(c); return c;
    });
    const hit = svg("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b,
      fill: "transparent" });
    hit.addEventListener("pointermove", (e) => {
      const px = e.clientX - s.getBoundingClientRect().left;
      let best = 0;
      x.forEach((v, i) => { if (Math.abs(X(v) - px) < Math.abs(X(x[best]) - px)) best = i; });
      hair.setAttribute("x1", X(x[best])); hair.setAttribute("x2", X(x[best]));
      hair.setAttribute("visibility", "visible");
      const rows = [];
      names.forEach((n, k) => {
        const v = f.series[n][best];
        dots[k].setAttribute("visibility", v === null ? "hidden" : "visible");
        if (v === null) return;
        dots[k].setAttribute("cx", X(x[best])); dots[k].setAttribute("cy", Y(v));
        rows.push({ color: cssVar(SERIES[k % 8]), value: `${fmt(v)} ${unit(f.unit)}`.trim(),
          label: names.length > 1 ? n : "" });
      });
      showTip(e, `${f.xlabel}: ${fmt(x[best])}`, rows);
    });
    hit.addEventListener("pointerleave", () => {
      hair.setAttribute("visibility", "hidden");
      dots.forEach((d) => d.setAttribute("visibility", "hidden")); hideTip();
    });
    s.append(hit);
    host.insertBefore(s, host.querySelector("details"));
  };
  if (names.length > 1)
    host.append(el("div", { class: "legend" }, names.map((n, k) =>
      el("span", {}, el("i", { style: `background:var(${SERIES[k % 8]})` }), unit(n)))));
  const stride = Math.max(1, Math.ceil(x.length / 40));
  host.append(el("details", { class: "table" }, el("summary", {}, "Data table"),
    el("table", {}, el("tr", {}, el("th", {}, f.xlabel), names.map((n) => el("th", {}, n))),
      x.filter((_, i) => i % stride === 0).map((_, r) => el("tr", {},
        el("td", {}, fmt(x[r * stride])),
        names.map((n) => el("td", {}, fmt(f.series[n][r * stride]))))))));
  draw();
  new ResizeObserver(draw).observe(host);
}

/* ---------- heat map ---------- */
function heatMap(host, f) {
  const nx = f.x.length, ny = f.y.length;
  const flat = f.values.flat().filter((v) => v !== null);
  const vmin = Math.min(...flat), vmax = Math.max(...flat);
  const scale = colourScale(vmin, vmax);
  const cv = el("canvas", { class: "img", width: nx, height: ny, role: "img",
    "aria-label": `${f.name}, ${fmt(vmin)} to ${fmt(vmax)} ${f.unit}` });
  const ctx = cv.getContext("2d"), img = ctx.createImageData(nx, ny);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const v = f.values[i][j], o = ((ny - 1 - j) * nx + i) * 4;
    const c = v === null ? [128, 128, 128] : scale.at(v);
    img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const lx = f.x[nx - 1] - f.x[0] + (f.x[1] - f.x[0]), ly = f.y[ny - 1] - f.y[0] + (f.y[1] - f.y[0]);
  const aspect = Math.min(1.25, Math.max(0.18, ly / lx));
  cv.style.aspectRatio = `${1} / ${aspect}`;
  cv.addEventListener("pointermove", (e) => {
    const r = cv.getBoundingClientRect();
    const i = Math.min(nx - 1, Math.max(0, Math.floor((e.clientX - r.left) / r.width * nx)));
    const j = Math.min(ny - 1, Math.max(0, ny - 1 - Math.floor((e.clientY - r.top) / r.height * ny)));
    showTip(e, `${f.xlabel} ${fmt(f.x[i])}, ${f.ylabel} ${fmt(f.y[j])}`,
      [{ value: `${fmt(f.values[i][j])} ${unit(f.unit)}`.trim() }]);
  });
  cv.addEventListener("pointerleave", hideTip);
  const bar = el("canvas", { width: 1, height: 128 });
  const bctx = bar.getContext("2d"), bimg = bctx.createImageData(1, 128);
  for (let k = 0; k < 128; k++) {
    const c = scale.at(scale.hi - (scale.hi - scale.lo) * k / 127);
    bimg.data.set([c[0], c[1], c[2], 255], k * 4);
  }
  bctx.putImageData(bimg, 0, 0);
  host.append(el("div", { class: "heat" },
    el("div", { class: "heat-main" }, cv,
      el("div", { class: "axis" }, el("span", {}, fmt(f.x[0])), el("span", {}, f.xlabel),
        el("span", {}, fmt(f.x[nx - 1]))),
      el("div", { class: "hint" }, `${f.ylabel}: ${fmt(f.y[0])} (bottom) to ${fmt(f.y[ny - 1])} (top)`)),
    el("div", { class: "cbar" }, el("span", {}, `${fmt(scale.hi)} ${unit(f.unit)}`), bar,
      el("span", {}, `${fmt(scale.lo)} ${unit(f.unit)}`))));
}

/* ---------- result rendering ---------- */
const STATUS = { pass: ["✓", "Pass"], warn: ["!", "Warning"], fail: ["✕", "Fail"],
  skip: ["–", "N/A"] };
function badge(status, large) {
  return el("span", { class: `badge ${status}${large ? " lg" : ""}`, "aria-hidden": "true" },
    STATUS[status][0]);
}
function renderResult(r) {
  const out = [], v = r.verification;
  const st = v.verdict === "VERIFIED" ? "pass" : v.ok ? "warn" : "fail";
  const big = { pass: "Verified", warn: "Passed with warnings",
    fail: "Failed self-checks: do not trust these numbers" }[st];
  out.push(el("div", { class: "card verdict" }, badge(st, true),
    el("div", {}, el("div", { class: "big" }, big),
      el("div", { class: "sub" }, v.summary.replace(/^[A-Z ]+: /, "") +
        (r.resolution ? `  ·  resolution ${r.resolution}  ·  ${r.elapsed_s} s` : "")))));
  const keys = Object.keys(r.results);
  if (keys.length) out.push(el("div", { class: "tiles" }, keys.map((k) =>
    el("div", { class: "tile" }, el("div", { class: "k" }, human(k)),
      el("div", { class: "v" }, fmt(r.results[k].value),
        el("span", { class: "u" }, unit(r.results[k].unit)))))));
  if (r.notes && r.notes.length) out.push(el("div", { class: "card note" }, r.notes.join("\n")));
  if (r.fields && r.fields.length) {
    const plots = el("div", { class: "plots" });
    out.push(plots);
    for (const f of r.fields) {
      const host = el("div", { class: "card" }, el("div", { class: "plot-title" },
        f.name + (f.unit && f.kind === "image" ? ` [${unit(f.unit)}]` : "")));
      plots.append(host);
      requestAnimationFrame(() => (f.kind === "image" ? heatMap : lineChart)(host, f));
    }
  }
  const checks = el("div", { class: "card" }, el("h2", {}, "How this result was checked"));
  const cats = [...new Set(v.checks.map((c) => c.category))];
  for (const cat of cats) {
    checks.append(el("div", { class: "checks-cat" }, cat));
    for (const c of v.checks.filter((c) => c.category === cat))
      checks.append(el("div", { class: `check ${c.status}` }, badge(c.status),
        el("span", { class: "st" }, STATUS[c.status][1]),
        el("div", {}, el("div", { class: "nm" }, c.name), el("div", { class: "dt" }, c.detail))));
  }
  out.push(checks);
  return out;
}

/* ---------- static report mode ---------- */
function renderStatic(data) {
  $("app").classList.add("static");
  for (const id of ["sidebar", "ask", "params"]) $(id).remove();
  const last = data.results[data.results.length - 1];
  $("head").append(el("h1", {}, last ? last.title : "Simulate Anything"));
  if (data.problem) $("head").append(el("p", { class: "lead" }, data.problem));
  const res = $("results");
  if (data.answer) res.append(el("div", { class: "card" }, el("h2", {}, "Answer"),
    el("div", { class: "note" }, data.answer)));
  data.results.forEach((r, i) => {
    if (data.results.length > 1)
      res.append(el("div", { class: "run-head" }, `Run ${i + 1} of ${data.results.length}: ${r.name}`));
    res.append(...renderResult(r));
  });
}

/* ---------- interactive app ---------- */
const state = { catalog: [], sim: null, values: {}, resolution: null, timer: null, seq: 0 };

function buildNav(filter) {
  const nav = $("nav"); nav.replaceChildren();
  let domain = null;
  for (const s of state.catalog) {
    const text = `${s.name} ${s.title} ${s.domain} ${s.description}`.toLowerCase();
    if (filter && !text.includes(filter)) continue;
    if (s.domain !== domain) { domain = s.domain; nav.append(el("div", { class: "domain" }, domain)); }
    nav.append(el("button", { class: "nav-item", "aria-current": state.sim === s ? "true" : null,
      onclick: () => select(s.name) }, s.title.split(" (")[0]));
  }
}
function select(name, values) {
  state.sim = state.catalog.find((s) => s.name === name);
  if (!state.sim) return;
  state.values = {};
  for (const p of state.sim.params)
    state.values[p.name] = values && values[p.name] !== undefined
      ? values[p.name] : p.default;
  state.resolution = state.sim.default_resolution;
  buildNav($("search").value.trim().toLowerCase());
  $("head").replaceChildren(el("h1", {}, state.sim.title),
    el("p", { class: "lead" }, state.sim.description));
  buildForm();
  history.replaceState(null, "", "#" + name);
  schedule(0);
}
function buildForm() {
  const form = $("params"); form.replaceChildren(el("h2", {}, "Inputs"));
  for (const p of state.sim.params) {
    const id = "p-" + p.name, val = state.values[p.name];
    const field = el("div", { class: "field" }, el("label", { for: id }, human(p.name)),
      p.doc ? el("div", { class: "doc" }, p.doc) : null);
    const set = (v) => { state.values[p.name] = v; schedule(250); };
    if (p.kind === "choice") {
      const sel = el("select", { id, onchange: (e) => set(e.target.value) },
        p.choices.map((c) => el("option", { value: c, selected: c === val ? "" : null }, c)));
      field.append(sel);
    } else if (p.kind === "bool") {
      const cb = el("input", { id, type: "checkbox", onchange: (e) => set(e.target.checked) });
      cb.checked = !!val; field.append(cb);
    } else if (p.kind === "int" || p.kind === "number") {
      field.append(el("input", { id, type: "number", value: val, step: p.kind === "int" ? 1 : "any",
        onchange: (e) => set(p.kind === "int" ? parseInt(e.target.value, 10) : parseFloat(e.target.value)) }));
    } else if (p.kind === "json" || Array.isArray(val) || (val && typeof val === "object")) {
      const err = el("div", { class: "err" });
      field.append(el("textarea", { id, spellcheck: "false", onchange: (e) => {
        try { err.textContent = ""; set(JSON.parse(e.target.value)); }
        catch (x) { err.textContent = "Not valid JSON: " + x.message; }
      } }, JSON.stringify(val, null, 1)), err);
    } else {
      const text = el("input", { id, type: "text", value: typeof val === "number"
        ? `${val} ${p.unit}`.trim() : val, onchange: (e) => set(e.target.value) });
      field.append(text);
      if (p.min !== undefined && p.max !== undefined && p.display_scale) {
        const toShown = (u) => (u - p.display_offset) / p.display_scale;
        const lo = toShown(p.min), hi = toShown(p.max);
        const slider = el("input", { type: "range", min: lo, max: hi, step: (hi - lo) / 400,
          value: toShown(p.default_value), "aria-label": human(p.name),
          oninput: (e) => {
            text.value = `${fmt(parseFloat(e.target.value))} ${p.display_unit}`.trim();
            set(text.value);
          } });
        field.append(slider);
      }
    }
    form.append(field);
  }
  form.append(el("div", { class: "field" }, el("label", { for: "p-res" }, "resolution"),
    el("div", { class: "doc" }, state.sim.resolution_meaning),
    el("input", { id: "p-res", type: "number", min: 8, step: 8, value: state.resolution,
      onchange: (e) => { state.resolution = parseInt(e.target.value, 10) || null; schedule(0); } })),
    el("div", { class: "form-foot" },
      el("button", { class: "btn", onclick: () => select(state.sim.name) }, "Reset to defaults")));
}
function schedule(ms) { clearTimeout(state.timer); state.timer = setTimeout(runNow, ms); }
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
async function runNow() {
  const seq = ++state.seq, res = $("results");
  res.classList.add("loading");
  if (!res.children.length)
    res.append(el("div", { class: "card note" }, "Running the simulation and its checks\u2026"));
  try {
    const data = await post("/api/run", { name: state.sim.name, params: state.values,
      resolution: state.resolution });
    if (seq !== state.seq) return;       // a newer request superseded this one
    res.replaceChildren(...renderResult(data));
  } catch (e) {
    if (seq === state.seq) res.replaceChildren(el("div", { class: "card note" }, String(e.message)));
  } finally { if (seq === state.seq) res.classList.remove("loading"); }
}
async function ask() {
  const problem = $("ask-input").value.trim(), out = $("ask-out"), btn = $("ask-btn");
  if (!problem) return;
  btn.disabled = true; btn.textContent = "Working…";
  out.replaceChildren(el("div", { class: "hint" },
    "Choosing a model, running it and checking the result. This can take a minute."));
  try {
    const data = await post("/api/ask", { problem });
    out.replaceChildren(el("div", { class: "answer" }, data.answer));
    if (data.results.length) {
      const show = (i) => {
        const r = data.results[i];
        state.sim = state.catalog.find((s) => s.name === r.name) || state.sim;
        state.values = Object.assign({}, r.params); state.resolution = r.resolution || null;
        $("head").replaceChildren(el("h1", {}, r.title),
          el("p", { class: "lead" }, state.sim ? state.sim.description : ""));
        buildNav(""); if (state.sim) buildForm();
        ++state.seq; $("results").replaceChildren(...renderResult(r));
        chips.querySelectorAll(".chip").forEach((c, k) => c.setAttribute("aria-pressed", k === i));
      };
      const chips = el("div", { class: "attempts" }, data.results.map((r, i) =>
        el("button", { class: "chip", onclick: () => show(i) },
          badge(r.verification.verdict === "VERIFIED" ? "pass" : r.verification.ok ? "warn" : "fail"),
          `Run ${i + 1}: ${r.name}`)));
      out.append(chips);
      show(data.results.length - 1);
    }
  } catch (e) {
    out.replaceChildren(el("div", { class: "hint" }, String(e.message)));
  } finally { btn.disabled = false; btn.textContent = "Simulate"; }
}
async function boot() {
  if (window.__STATIC__) return renderStatic(window.__STATIC__);
  const data = await (await fetch("/api/catalog")).json();
  state.catalog = data.simulations;
  if (!data.agent) {
    $("ask-input").disabled = true; $("ask-btn").disabled = true;
    $("ask-hint").textContent = "Plain-language mode needs the anthropic package and " +
      "ANTHROPIC_API_KEY set before starting the server. Every simulation on the left works without it.";
  }
  $("ask-btn").addEventListener("click", ask);
  $("ask-input").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
  $("search").addEventListener("input", (e) => buildNav(e.target.value.trim().toLowerCase()));
  const wanted = location.hash.slice(1);
  select(state.catalog.some((s) => s.name === wanted) ? wanted : state.catalog[0].name);
}
boot();
</script>
</body>
</html>
