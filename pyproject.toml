[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-create-anything"
version = "0.2.0"
description = "Genie: create anything, tested against the real world on simulations that check themselves"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Eddy Ma" }]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
agent = ["anthropic>=2.0"]
dev = ["pytest>=7"]

[project.scripts]
simulate-anything = "simulate_anything.cli:main"
genie = "create_anything.__main__:main"
create-anything = "create_anything.__main__:main"

[tool.setuptools.packages.find]
include = ["simulate_anything*", "create_anything*"]

[tool.setuptools.package-data]
simulate_anything = ["web/*.html"]
create_anything = ["web/dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
