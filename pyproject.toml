[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulate-anything"
version = "0.1.0"
description = "Turn a physics problem into a simulation that checks itself"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Eddy Ma" }]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
agent = ["anthropic>=2.0"]
dev = ["pytest>=7"]

[project.scripts]
simulate-anything = "simulate_anything.cli:main"

[tool.setuptools.packages.find]
include = ["simulate_anything*"]

[tool.setuptools.package-data]
simulate_anything = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
